name: VoiceForge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy librosa soundfile scipy
    
    - name: Test preprocessing module
      run: |
        python -c "
        import numpy as np
        import librosa
        import soundfile as sf
        import tempfile, os

        # Create a test sine wave audio
        sr = 22050
        t = np.linspace(0, 3, sr * 3)
        audio = 0.5 * np.sin(2 * np.pi * 440 * t).astype(np.float32)

        # Write temp file
        with tempfile.NamedTemporaryFile(suffix='.wav', delete=False) as f:
            sf.write(f.name, audio, sr)
            tmp = f.name

        # Test normalisation formula: a_hat = 0.95 * a / max|a|
        audio_loaded, _ = librosa.load(tmp, sr=sr, mono=True)
        normalised = audio_loaded / np.max(np.abs(audio_loaded)) * 0.95
        assert np.max(np.abs(normalised)) <= 0.95 + 1e-6, 'Normalisation failed'
        assert np.max(np.abs(normalised)) > 0.94, 'Normalisation too aggressive'

        # Test trim
        trimmed, _ = librosa.effects.trim(audio_loaded, top_db=20)
        assert len(trimmed) > 0, 'Trim removed all audio'

        os.unlink(tmp)
        print('✅ All preprocessing tests passed')
        "
    
    - name: Test WER formula
      run: |
        python -c "
        def compute_wer(ref, hyp):
            r, h = ref.lower().split(), hyp.lower().split()
            d = [[0]*(len(h)+1) for _ in range(len(r)+1)]
            for i in range(len(r)+1): d[i][0] = i
            for j in range(len(h)+1): d[0][j] = j
            for i in range(1,len(r)+1):
                for j in range(1,len(h)+1):
                    d[i][j] = d[i-1][j-1] if r[i-1]==h[j-1] else 1+min(d[i-1][j],d[i][j-1],d[i-1][j-1])
            return d[len(r)][len(h)] / len(r)

        # Perfect match
        assert compute_wer('hello world', 'hello world') == 0.0, 'Perfect match should be 0'

        # One substitution in 2 words = 0.5
        assert compute_wer('hello world', 'hello there') == 0.5, 'One sub in 2 words'

        # All wrong = 1.0
        assert compute_wer('hello world', 'foo bar') == 1.0, 'All wrong should be 1.0'

        print('✅ WER formula tests passed')
        "
    
    - name: Validate project structure
      run: |
        python -c "
        import os
        required = ['requirements.txt', 'README.md', '.gitignore',
                    'evaluate.py', 'wer_only.py', 'wer_analysis.py']
        missing = [f for f in required if not os.path.exists(f)]
        if missing:
            print(f'❌ Missing files: {missing}')
            exit(1)
        print('✅ All required project files present')
        "
